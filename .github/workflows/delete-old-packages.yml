name: Delete Old Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 6'
      timezone: 'Europe/Berlin'

jobs:
  delete-packages:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
    - uses: smartsquaregmbh/delete-old-packages@78421c4341be2a20cc4766902b4dc2925efa5117
      with:
        user: 'svengo'
        type: 'container'
        version-pattern: '^(?:\\d+)\\.(?:\\d+)\\.(?:\\d+).*$'
        keep: 10
        names: |
          tor
