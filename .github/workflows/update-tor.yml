name: Update Tor Version

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get latest Tor release from Atom feed
        id: tor
        run: |
          set -euo pipefail

          FEED=$(curl -s "https://gitlab.torproject.org/tpo/core/tor/-/tags?format=atom")

          VERSION=$(echo "$FEED" | grep -oP '(?<=<title>tor-)[^<]+' | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Failed to parse Atom feed" >&2
            echo "Feed content:" >&2
            echo "$FEED" >&2
            exit 1
          fi

          case "$VERSION" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "Invalid Tor version: '$VERSION'" >&2
              exit 1
              ;;
          esac
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          CURRENT=$(grep '^ARG TOR_VERSION=' Dockerfile | grep -oP '(?<=ARG TOR_VERSION=)[^[:space:]]+')
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT
          
          echo "Latest Tor version: $VERSION"
          echo "Current version: $CURRENT"

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.tor.outputs.version }}" != "${{ steps.tor.outputs.current_version }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.tor.outputs.current_version }} → ${{ steps.tor.outputs.version }}"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date: ${{ steps.tor.outputs.version }}"
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.update_needed == 'true'
        run: |
          sed -i "s/ARG TOR_VERSION=.*/ARG TOR_VERSION=${{ steps.tor.outputs.version }}/" Dockerfile
          echo "Updated Dockerfile:"
          grep "ARG TOR_VERSION" Dockerfile

      - name: Create signed Dockerfile commit
        id: dockerfile_pr
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: Dockerfile
          commit-message: "chore: update Dockerfile to Tor ${{ steps.tor.outputs.version }}"
          branch: update/tor-${{ steps.tor.outputs.version }}
          sign-commits: true

      - name: Get Dockerfile commit SHA on PR branch
        id: dockerfile_sha
        if: steps.check.outputs.update_needed == 'true'
        env:
          TOR_VERSION: ${{ steps.tor.outputs.version }}
        run: |
          set -euo pipefail

          BRANCH="update/tor-${TOR_VERSION}"
          git fetch origin "$BRANCH" --depth=20

          SHA=$(git log --format=%H "origin/$BRANCH" -- Dockerfile | head -n 1)
          if [ -z "$SHA" ]; then
            echo "No Dockerfile commit found on branch $BRANCH" >&2
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update README.md
        if: steps.check.outputs.update_needed == 'true'
        env:
          TOR_VERSION: ${{ steps.tor.outputs.version }}
          DOCKERFILE_COMMIT: ${{ steps.dockerfile_sha.outputs.sha }}
        run: |
          sed -E -i "s/`latest`, `[^`]+`/`latest`, `${TOR_VERSION}`/" README.md
          sed -E -i "s;https://github.com/svengo/docker-tor/blob/[^/]+/Dockerfile;https://github.com/svengo/docker-tor/blob/${DOCKERFILE_COMMIT}/Dockerfile;" README.md

          echo "Updated README.md:"
          grep -A 1 "Supported Tor Versions" README.md | head -3

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: README.md
          commit-message: "docs: update README to Tor ${{ steps.tor.outputs.version }}"
          title: "chore: update Tor to ${{ steps.tor.outputs.version }}"
          body: |
            Automated update from [Tor GitLab tag](https://gitlab.torproject.org/tpo/core/tor/-/tags/tor-${{ steps.tor.outputs.version }})

            **Changes:**
            - Updated `TOR_VERSION` to `${{ steps.tor.outputs.version }}` in Dockerfile
            - Updated version references in README.md
            - Linked the README entry to the exact Dockerfile commit:
              https://github.com/svengo/docker-tor/blob/${{ steps.dockerfile_sha.outputs.sha }}/Dockerfile

            Please verify the release and test the build before merging.
          branch: update/tor-${{ steps.tor.outputs.version }}
          labels: |
            tor
          delete-branch: true
          sign-commits: true
