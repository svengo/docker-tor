name: Publish release and weekly rebuild

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Determine checkout ref (release tag, latest release for schedule, or current ref)
        id: determine-ref
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] || [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "No latest release found; nothing to rebuild. Exiting."
              exit 0
            fi
            echo "CHECKOUT_REF=refs/tags/$TAG" >> $GITHUB_ENV
            echo "Using latest release tag: $TAG"
          elif [ "${GITHUB_EVENT_NAME:-}" = "release" ]; then
            TAG=$(jq -r .release.tag_name < "${GITHUB_EVENT_PATH}")
            echo "CHECKOUT_REF=refs/tags/$TAG" >> $GITHUB_ENV
            echo "Using release tag from event: $TAG"
          else
            echo "CHECKOUT_REF=${GITHUB_REF:-refs/heads/main}" >> $GITHUB_ENV
            echo "Using event ref: ${GITHUB_REF:-refs/heads/main}"
          fi

      - name: Checkout chosen ref
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}
          short-description: ${{ github.event.repository.description }}

      - name: Read TOR_VERSION from Dockerfile
        id: torver
        run: |
          set -euo pipefail
          TOR_LINE=$(grep -E '^ARG[[:space:]]+TOR_VERSION=' Dockerfile | head -n1 || true)
          if [ -z "$TOR_LINE" ]; then
            echo "ERROR: TOR_VERSION not found in Dockerfile. Aborting." >&2
            exit 1
          else
            TOR_VERSION=$(echo "$TOR_LINE" | cut -d'=' -f2- | sed -e "s/['\"]//g" | tr -d '[:space:]')
            echo "TOR_VERSION=$TOR_VERSION" >> $GITHUB_ENV
          fi

      - name: Build Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            ${{ env.TOR_VERSION }}
            type=sha
          
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: push
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
        
      - name: Attest DockerHub
        id: attest-dh
        uses: actions/attest@v4
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest ghcr
        id: attest-ghcr
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          
      - name: Generate job summary
        id: job-summary
        run: |
          SUMMARY=$(printf '%s\n' "## Docker tags" '```' ${DOCKER_METADATA_OUTPUT_TAGS} '```')
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
